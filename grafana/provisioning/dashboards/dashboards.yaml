# Grafana Dashboard Provider
# JSON-Dateien unter /var/lib/grafana/dashboards/ werden automatisch geladen.
# Unterverzeichnisse werden als Grafana-Ordner abgebildet.

apiVersion: 1

providers:
  - name: default
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
